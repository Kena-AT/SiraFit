groups:
  - name: sirafit_alerts
    rules:
      - alert: HighApi5xxRate
        expr: sum(rate(sirafit_http_requests_total{status=~"5.."}[5m])) / sum(rate(sirafit_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "High API 5xx error rate detected"
          description: "Over 5% of API requests resulted in HTTP 5xx responses for more than 2 minutes."

      - alert: HighApiLatency
        expr: histogram_quantile(0.95, sum(rate(sirafit_http_request_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 3m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "API 95th percentile latency exceeds 2 seconds"
          description: "p95 request duration has remained above 2s for over 3 minutes."

      - alert: DbPoolSaturation
        expr: (sirafit_db_pool_checked_out / sirafit_db_pool_size) > 0.85
        for: 2m
        labels:
          severity: warning
          service: database
        annotations:
          summary: "Database connection pool approaching exhaustion"
          description: "More than 85% of steady-state database pool connections are checked out."

      - alert: CeleryWorkerUnavailable
        expr: sirafit_celery_worker_alive == 0
        for: 2m
        labels:
          severity: critical
          service: celery
        annotations:
          summary: "No Celery workers available"
          description: "SiraFit cannot detect any active background workers to process asynchronous queues."
