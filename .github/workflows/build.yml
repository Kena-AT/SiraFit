name: Release Artifacts & Container Build

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kena-at/sirafit

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Multi-Stage Docker Builds & Smoke Tests ─────────────────────────────────
  build-and-smoke-test:
    name: Build & Smoke Test Containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}-backend:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Runtime Smoke Test (Backend)
        run: |
          docker run -d --name smoke-backend -p 8000:8000 \
            -e SECRET_KEY="smoke_test_secret_key_minimum_32_characters" \
            -e DATABASE_URL="sqlite:///./smoke.db" \
            -e CORS_ORIGINS="http://localhost:8080" \
            -e ENVIRONMENT="testing" \
            ${{ env.IMAGE_NAME }}-backend:smoke-test

          sleep 5
          docker logs smoke-backend
          docker stop smoke-backend
          docker rm smoke-backend

      - name: Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata (Celery Worker)
        id: meta-celery
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-celery-worker
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & Push Celery Worker
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.celery
          push: true
          tags: ${{ steps.meta-celery.outputs.tags }}
          labels: ${{ steps.meta-celery.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Vulnerability Scan & SBOM Generation ───────────────────────────────────
  security-and-sbom:
    name: Security Scan & SBOM Generation
    runs-on: ubuntu-latest
    needs: build-and-smoke-test
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy Vulnerability Scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy Results to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'container-backend'
        continue-on-error: true

      - name: Generate SBOM for Release (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}'
          format: 'spdx-json'
          output-file: 'sirafit-backend-${{ github.sha }}.spdx.json'
        continue-on-error: true

      - name: Upload Release SBOM
        uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: '*.spdx.json'
          retention-days: 30
