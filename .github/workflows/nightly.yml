name: Nightly Deep Audit

on:
  schedule:
    - cron: "0 2 * * *" # Daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  nightly-deep-tests:
    name: Nightly — Full Test Suite (Slow & Integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sirafit_nightly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt alembic

      - name: Run Full Pytest Suite (Including slow tests)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sirafit_nightly
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: nightly_mock_secret_key_minimum_32_characters
          ALGORITHM: HS256
          ENVIRONMENT: testing
          PYTHONPATH: backend
        run: |
          cd backend
          pytest ../tests/ -v --tb=short
