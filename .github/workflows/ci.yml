name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ─── Stage 1: Fast Security & Secret Scanning ──────────────────────────────
  secret-scan:
    name: Security — Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependency-review:
    name: Security — Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          config-file: .github/dependency-review-config.yml
          fail-on-severity: high

  # ─── Stage 2: Quality & Fast Unit Tests (Parallel) ─────────────────────────
  backend-lint:
    name: Backend — Lint & Type Baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt ruff mypy

      - name: Ruff Lint Check
        run: ruff check app/ tests/ ../tests/

      - name: Ruff Format Check
        run: ruff format --check app/ tests/ ../tests/

      - name: MyPy Type Check (Baseline / Non-blocking)
        continue-on-error: true
        run: mypy app/ --ignore-missing-imports --no-error-summary

  backend-unit:
    name: Backend — Fast Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests with SQLite
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci_mock_secret_key_minimum_32_characters_long_for_tests
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "15"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          SMTP_HOST: smtp.example.com
          SMTP_PORT: "587"
          SMTP_USER: test@example.com
          SMTP_PASSWORD: test_password
          SMTP_FROM: noreply@sirafit.com
          CORS_ORIGINS: http://localhost:8080,http://localhost:5173
          ENVIRONMENT: testing
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: memory://
          CELERY_RESULT_BACKEND: cache+memory://
          ENABLE_TRACING: "False"
          ERROR_TRACKING_ENABLED: "False"
          PYTHONPATH: .
          NVIDIA_API_KEY: "nvapi-ci-mock-key-12345"
          OPENAI_API_KEY: "sk-ci-mock-key-12345"
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  backend-migration:
    name: Backend — PostgreSQL Migration Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sirafit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt alembic

      - name: Verify Live Alembic Migration on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sirafit_test
          SECRET_KEY: ci_mock_secret_key_minimum_32_characters_long_for_tests
          ALGORITHM: HS256
          CORS_ORIGINS: http://localhost:8080,http://localhost:5173
          SMTP_HOST: smtp.example.com
          SMTP_PORT: "587"
          SMTP_USER: test@example.com
          SMTP_PASSWORD: test_password
          SMTP_FROM: noreply@sirafit.com
          PYTHONPATH: .
        run: |
          alembic upgrade head

  frontend-quality:
    name: Frontend — Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm install -g npm@11
          npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Prettier Format Check
        run: npx prettier --check .

  frontend-build:
    name: Frontend — Production Build
    runs-on: ubuntu-latest
    needs: frontend-quality
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm install -g npm@11
          npm ci

      - name: Build Web Application
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  extension-build:
    name: Extension — Plasmo Compile & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/extension
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Plasmo Browser Extension
        run: npm run build

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: frontend/extension/build/
          retention-days: 7

  # ─── Stage 3: Integration & End-to-End Testing ─────────────────────────────
  integration-test:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-migration, frontend-build]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sirafit_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt alembic

      - name: Apply Alembic Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sirafit_integration
          SECRET_KEY: ci_integration_secret_key_minimum_32_characters_long
          ALGORITHM: HS256
          CORS_ORIGINS: http://localhost:8080,http://localhost:5173
          SMTP_HOST: smtp.example.com
          SMTP_PORT: "587"
          SMTP_USER: test@example.com
          SMTP_PASSWORD: test_password
          SMTP_FROM: noreply@sirafit.com
          PYTHONPATH: backend
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Integration & Asynchronous Task Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sirafit_integration
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          SECRET_KEY: ci_integration_secret_key_minimum_32_characters_long
          ALGORITHM: HS256
          CORS_ORIGINS: http://localhost:8080,http://localhost:5173
          SMTP_HOST: smtp.example.com
          SMTP_PORT: "587"
          SMTP_USER: test@example.com
          SMTP_PASSWORD: test_password
          SMTP_FROM: noreply@sirafit.com
          ENVIRONMENT: testing
          PYTHONPATH: backend
        run: |
          cd backend
          pytest ../tests/ -v --tb=short -k "integration or celery or session"

      - name: Install frontend & Playwright dependencies
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          CI: "true"
        run: |
          cd frontend
          npm run test:e2e:ci || true

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─── Stage 4: Master CI Status Gate ─────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - backend-lint
      - backend-unit
      - backend-migration
      - frontend-quality
      - frontend-build
      - extension-build
      - integration-test
    if: always()
    steps:
      - name: Assess All Required CI Results
        run: |
          echo "Secret Scan: ${{ needs.secret-scan.result }}"
          echo "Backend Lint: ${{ needs.backend-lint.result }}"
          echo "Backend Unit: ${{ needs.backend-unit.result }}"
          echo "Backend Migration: ${{ needs.backend-migration.result }}"
          echo "Frontend Quality: ${{ needs.frontend-quality.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Extension Build: ${{ needs.extension-build.result }}"
          echo "Integration Test: ${{ needs.integration-test.result }}"

          if [[ "${{ needs.secret-scan.result }}" != "success" && "${{ needs.secret-scan.result }}" != "skipped" ]] || \
             [[ "${{ needs.backend-lint.result }}" != "success" ]] || \
             [[ "${{ needs.backend-unit.result }}" != "success" ]] || \
             [[ "${{ needs.backend-migration.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-quality.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-build.result }}" != "success" ]] || \
             [[ "${{ needs.extension-build.result }}" != "success" ]] || \
             [[ "${{ needs.integration-test.result }}" != "success" ]]; then
            echo "ERROR: One or more required CI checks failed or were cancelled."
            exit 1
          fi
          echo "SUCCESS: All required CI checks passed cleanly."
