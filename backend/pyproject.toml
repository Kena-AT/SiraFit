[tool.pytest.ini_options]
# Tests live in the repo-root `tests/` directory (relocated from backend/tests).
# `pythonpath = ["."]` keeps `import app` working when pytest is run from
# `./backend` (as CI does), and `testpaths` points at the relocated suite.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length (handled by ruff format)
    "E712",  # comparison to True/False (SQLAlchemy query filters)
    "E402",  # module level import not at top of file
    "W291",  # trailing whitespace in multiline templates
    "W293",  # whitespace in multiline template blank lines
]
