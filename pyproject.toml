[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests", "backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "backend/migrations",
    ".venv",
    "venv",
    "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length (handled by ruff format)
    "E712",  # comparison to True/False (SQLAlchemy query filters)
    "E402",  # module level import not at top of file
    "W291",  # trailing whitespace in multiline templates
    "W293",  # whitespace in multiline template blank lines
]
